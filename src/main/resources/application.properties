spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/preference_center}
spring.datasource.username=${DB_USERNAME:preference_user}
spring.datasource.password=${DB_PASSWORD:preference_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8080